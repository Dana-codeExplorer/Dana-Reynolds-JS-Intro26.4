<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/openapi.css" />
    <title>OpenAPI</title>
  </head>
  <body class="cat-body">
    <h1 class="cat-h1">Cat API</h1>
    <nav class="cat-navbar">
      <ul class="cat-navList">
        <li class="cat-navItem"><a href="./index.html">Home</a></li>
        <li class="cat-navItem"><a href="./openapi.html">Cat API</a></li>
      </ul>
    </nav>
    <!-- Cat Breeds Section ***** -->
    <h2>Cat Breeds</h2>
    <div id="cat-breeds"></div>
    <button id="fetch-cat-breeds" class="cat-button">Fetch Cats Breeds</button>
    <!-- Cat Fact Section ***** -->

    <h2>Cat Fact</h2>
    <div id="cat-fact"></div>

    <button id="fetch-cat-fact" class="cat-button">Fetch Cats Fact</button>
    <script src="js/openapi.js"></script>

    <!-- Search Form Section ***** -->
    <h2>Search Cats</h2>
    <form id="search-cat-form">
      <label for="search-cat-input">Search for a cat breed:</label>
      <input type="text" id="search-cat-input" placeholder="Enter cat breed" />
      <button type="submit" class="cat-button">Search</button>
    </form>
    <div id="search-cat-container">
      <h3>Search Results</h3>
      <p id="search-cat-results"> </p>
    </div>
  </body>
</html>
